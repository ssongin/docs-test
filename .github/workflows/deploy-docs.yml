name: Deploy documentation

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  extract-commit-message:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_message: ${{ steps.commit.outputs.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
      - id: commit
        run: echo "message=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

  validate-commit-message:
    needs: extract-commit-message
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
    uses: ssongin/gha-commit/.github/workflows/validate-commit-message.yml@master
    with:
      commit_message: ${{ needs.extract-commit-message.outputs.commit_message }}

  bump-version-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit != null
    permissions:
      contents: write
    uses: ssongin/gha-commit/.github/workflows/bump-version-tag.yml@master
    with:
      commit_message: ${{ github.event.head_commit.message }}

  find-created-version-tag:
    needs: bump-version-tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          tag="$(git tag --points-at "$COMMIT_SHA" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-tagged-docs:
    needs: find-created-version-tag
    if: needs.find-created-version-tag.outputs.tag != ''
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      pages_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      docs_dir: docs
      dist_dir: docs/.vitepress/dist
      install_command: npm ci --prefix docs
      build_command: npm --prefix docs run docs:build
      node_version: '22'
      pages_branch: gh-pages
      deployment_path: versions/${{ needs.find-created-version-tag.outputs.tag }}

  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/publish-docs.yml
    with:
      pages_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      docs_dir: docs
      dist_dir: docs/.vitepress/dist
      install_command: npm ci --prefix docs
      build_command: npm --prefix docs run docs:build
      node_version: '22'
      pages_branch: gh-pages
      deployment_path: ${{ startsWith(github.ref, 'refs/tags/v') && format('versions/{0}', github.ref_name) || '' }}
